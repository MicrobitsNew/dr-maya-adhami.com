        #services .journey-swiper-next {

        #services .journey-swiper-prev:hover,
        #services .journey-swiper-next:hover {

        #about-clinic .btn-default.btn-highlighted:hover {

        .contact-info-item.orange .icon-box,
        .contact-info-item.orange .icon-box::before {
            background-color: #CB99BD;
        }

        .orange .contact-info-content h3 {
            color: #CB99BD;
        }

        .professional-list li,
        .journey-item-content h3 {
            color: white !important;
        }

        .contact-info-item.pink .icon-box,
        .contact-info-item.pink .icon-box::before {
            background-color: #F13569;
        }

        .pink .contact-info-content h3 {
            color: #F13569;
        }

        .contact-info-item.blue .icon-box,
        .contact-info-item.blue .icon-box::before {
            background-color: #0E89D4;
        }

        .blue .contact-info-content h3 {
            color: #0E89D4;
        }

        .page-contact-us,
        .conatct-us-form {
            background-color: #f1356942;
        }

        #contact .section-title h2 {
            color: #2A2A2A;
        }

        .our-approach-body {
            padding: 0;
            border: none;
        }

        .mission-vison-item {
            margin: 0;
            padding: 40px 0;
            border-top: 1px solid #E8EAF6;
        }

        .professional-list li,
        .journey-item-content h3 {
            color: #2A2A2A;
        }

        .contact-info-item,
        .contact-form {
            background-color: white;
        }

        .contact-form form .form-control {
            background-color: #E8EAF6;
        }

        .main-footer {
            padding: 18px 0;
            border-radius: 15px 15px 0 0;
            background-color: white !important;
        }

        .footer-copyright-text p,
        .footer-social-icons .social-icon,
        .footer-copyright-text a {
            color: #5C6BC0;
        }

        /* .contact-info-item {
            width: calc(24% - 20px);
        } */

        .contact-form {
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .conatct-us-form img {
            height: 100%;
            width: 100%;
            object-fit: cover;
            border-radius: 0 40px 40px 0;
        }

        .hero.hero-bg-image.hero-1 {
            background: linear-gradient(to right, rgba(92, 107, 192, 1) 45%, rgba(92, 107, 192, 0.1) 100%),
                url(./images/hero/hero1.webp) no-repeat center center;
            background-size: cover;
        }

        .hero.hero-bg-image.hero-2 {
            background: linear-gradient(to right, rgba(92, 107, 192, 1) 45%, rgba(92, 107, 192, 0.1) 100%),
                url(./images/hero/hero2.webp) no-repeat center center;
            background-size: cover;
        }

        .hero.hero-bg-image::before {
            content: none;
        }

        header.main-header .header-sticky {
            background: transparent;
            box-shadow: none;
        }

        .main-logo,
        .preloader {
            filter: brightness(0) invert(1);
        }

        .navbar {
            padding: 12px 20px;
        }

        .main-menu ul li a {
            color: white;
        }

        header.main-header .header-sticky.active .main-menu ul li a {
            color: #2A2A2A;
        }

        header.main-header .header-sticky.active .main-logo {
            filter: none;
        }

        #products {
            background-color: #943F20;
        }

        .product-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
            gap: 20px;
            align-items: stretch;
        }

        .product-card {
            background: #fff;
            border-radius: 12px;
            padding: 15px;
            text-align: center;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            height: 100%;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05);
            transition: 0.3s ease;
        }

        .product-card img {
            width: 100%;
            height: 160px;
            object-fit: contain;
            margin-bottom: 10px;
        }

        .product-card:not(:has(img)) {
            padding-top: 40px;
        }

        /* Full-width category header — forces each category onto a new row in "All" view */
        .product-category-break {
            grid-column: 1 / -1;
        }

        .product-category-break h4 {
            color: #fff;
            font-size: 22px;
            margin: 25px 0 5px;
            padding-bottom: 12px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.3);
        }

        .product-tab {
            padding: 10px 16px;
            border-radius: 25px;
            border: 1px solid #ddd;
            background: white;
            cursor: pointer;
            transition: 0.3s;
        }

        .product-tab.active {
            background: #394D9B;
            color: white;
        }

        @media (max-width: 576px) {
            #products {
                padding: 80px 0px !important;
            }

            .product-grid {
                grid-template-columns: repeat(2, 1fr);
                gap: 12px;
            }

            .product-card img {
                height: 120px;
            }
        }
    </style>

</head>

<body>

    <!-- Preloader Start -->
    <div class="preloader">
        <div class="loading-container">
            <div class="loading"></div>
            <div id="loading-icon"><img src="images/header/favicon.svg" alt=""></div>
        </div>
    </div>
    <!-- Preloader End -->

    <!-- Header Start -->
    <!-- Built from data/site.json by js/site-render.js.
         Do NOT hard-code the logo, menu or button here. -->
    <header class="main-header"></header>
    <!-- Header End -->


    <!-- Tabs, category headings and cards are all built from
         data/products.json by js/products-render.js.
         To add a brand or a product: edit that file, nothing here. -->
    <section id="products"></section>



    <!-- Footer Main Start -->
    <!-- Built from data/site.json by js/site-render.js.
         Do NOT hard-code the footer here: edit data/site.json instead. -->
    <footer class="main-footer bg-section dark-section"></footer>
    <!-- Footer Main End -->


    <!-- JS Scripts -->
    <script src="js/jquery-3.7.1.min.js"></script>
    <script src="js/bootstrap.min.js"></script>
    <script src="js/validator.min.js"></script>
    <script src="js/jquery.slicknav.js"></script>
    <script src="js/swiper-bundle.min.js"></script>
    <script src="js/jquery.waypoints.min.js"></script>
    <script src="js/jquery.counterup.min.js"></script>
    <script src="js/jquery.magnific-popup.min.js"></script>
    <script src="js/SmoothScroll.js"></script>
    <script src="js/parallaxie.js"></script>
    <script src="js/gsap.min.js"></script>
    <!-- <script src="js/magiccursor.js"></script> -->
    <script src="js/SplitText.js"></script>
    <script src="js/ScrollTrigger.min.js"></script>
    <script src="js/jquery.mb.YTPlayer.min.js"></script>
    <script src="js/wow.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/swiper@9/swiper-bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@fancyapps/ui@5.0/dist/fancybox/fancybox.umd.js"></script>

    <!-- ================================================================
         PAGE BUILDERS
         Each file below reads one file in data/ and fills in the empty
         sections above. Nothing on this page is hard-coded any more:
             data/site.json     - logo, menu, header button, footer
             data/products.json - tabs, category headings, product cards
         The filter tabs are built from the same categories as the cards,
         so the two can no longer drift apart.
         ================================================================ -->
    <script src="js/render-core.js"></script>
    <script src="js/site-render.js"></script>
    <script src="js/products-render.js"></script>

    <!-- Starts js/function.js once the page is built - otherwise WOW, the
         split-text headings and slicknav would run against empty
         sections - then resolves window.siteReady. -->
    <script src="js/boot.js"></script>

</body>

</html>
