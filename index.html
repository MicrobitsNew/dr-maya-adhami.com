        /* Gap between the info boxes and the form is handled by the

        /* ---- Service modals: image is fixed, only the text column scrolls ---- */
        @media only screen and (min-width: 768px) {

            /* cap the modal so each column can handle its own overflow.
               nowrap keeps image + text side by side (every table is now
               inside the text column, so the row only ever has 2 children) */
            .modal[id^="serviceModal"] .modal-content>.row {
                max-height: 85vh;
                flex-wrap: nowrap;
            }

            /* stop very short modals collapsing */
            .modal[id^="serviceModal"] .modal-content>.row {
                min-height: 420px;
            }

            /* image / slideshow column - clipped, never scrolls */
            .modal[id^="serviceModal"] .modal-content>.row>.col-md-6:first-child {
                position: relative;
                max-height: 85vh;
                overflow: hidden;
                background-color: #fff;
            }

            /* Pin the picture to the column box. Because it is taken out of
               flow, the TEXT decides how tall the modal is and the image
               simply fills whatever that turns out to be - no gaps, no
               letterboxing, no image-driven height. */
            .modal[id^="serviceModal"] .modal-content>.row>.col-md-6:first-child>img,
            .modal[id^="serviceModal"] .modal-content>.row>.col-md-6:first-child>.swiper {
                position: absolute;
                top: 0;
                left: 0;
                width: 100%;
                height: 100%;
            }

            .modal[id^="serviceModal"] .modal-content>.row>.col-md-6:first-child .swiper-wrapper,
            .modal[id^="serviceModal"] .modal-content>.row>.col-md-6:first-child .swiper-slide {
                height: 100%;
            }

            /* "contain" = the WHOLE picture is always visible. Nothing is ever
               cropped, which matters for before/after comparisons.
               max-height:none overrides maya.css .modal-content img {max-height:670px} */
            .modal[id^="serviceModal"] .modal-content>.row>.col-md-6:first-child img {
                display: block;
                width: 100%;
                height: 100%;
                max-height: none;
                object-fit: contain;
            }

            /* Opt a service into edge-to-edge cropping with "fit": "cover" in
               services.json. Only use it where losing the edges is harmless -
               never on before/after images. */
            .modal[id^="serviceModal"] .modal-content>.row>.col-md-6.fit-cover img {
                object-fit: cover;
            }

            /* text column - the only thing that scrolls */
            .modal[id^="serviceModal"] .text-box {
                max-height: 85vh;
                overflow-y: auto;
                overflow-x: hidden;
                scrollbar-width: thin;
                scrollbar-color: rgba(0, 0, 0, .25) transparent;
            }

            .modal[id^="serviceModal"] .text-box::-webkit-scrollbar {
                width: 6px;
            }

            .modal[id^="serviceModal"] .text-box::-webkit-scrollbar-track {
                background: transparent;
            }

            .modal[id^="serviceModal"] .text-box::-webkit-scrollbar-thumb {
                background: rgba(0, 0, 0, .25);
                border-radius: 3px;
            }
        }

    <!-- ================================================================
         PAGE BUILDERS
         Each file below reads one file in data/ and fills in the empty
         sections above. Nothing on this page is hard-coded any more:

    <!-- Starts js/function.js once the page is built - otherwise WOW, the
         GSAP reveal and slicknav would run against empty sections - then
         resolves window.siteReady. Everything below waits on it. -->
    <script src="js/boot.js"></script>

    <script>
        // Sliders can only start once their markup exists, so they all
        // hang off window.siteReady. window.homeReady carries the parsed
        // data/home.json, which is where their timings come from.
        window.siteReady.then(function () {
            return window.homeReady;
        }).then(function (home) {
            home = home || {};
            const hero = home.hero || {};
            const gallery = (home.aboutClinic || {}).gallery || {};

            new Swiper('.hero-swiper', {
                loop: true,
                autoplay: {
                    delay: hero.autoplayDelay || 2500,
                    disableOnInteraction: false,
                },
                speed: hero.speed || 1000,
                effect: 'fade',
                pagination: {
                    el: '.swiper-pagination',
                    clickable: true,
                },
                navigation: {
                    nextEl: '.swiper-button-next',
                    prevEl: '.swiper-button-prev',
                },
            });

            new Swiper('.clinic-swiper', {
                loop: true,
                autoplay: {
                    delay: gallery.autoplayDelay || 3000,
                    disableOnInteraction: false,
                },
                navigation: {
                    nextEl: '.clinic-swiper-next',
                    prevEl: '.clinic-swiper-prev',
                },
                watchSlidesProgress: true,
                slideToClickedSlide: false,
                preventClicks: false,
                preventClicksPropagation: false,
            });

            const serviceSliderOptions = {
                slidesPerView: 3,
                spaceBetween: 30,
                loop: true,
                autoplay: {
                    delay: 2500,
                    disableOnInteraction: false,
                },
                breakpoints: {
                    0: { slidesPerView: 1, spaceBetween: 15 },
                    768: { slidesPerView: 2, spaceBetween: 20 },
                    992: { slidesPerView: 3, spaceBetween: 30 },
                },
            };

            [1, 2].forEach(function (n) {
                new Swiper('.services-swiper-' + n, Object.assign({}, serviceSliderOptions, {
                    navigation: {
                        nextEl: '.journey-swiper-next-' + n,
                        prevEl: '.journey-swiper-prev-' + n,
                    },
                }));
            });
        });
    </script>

    <script>
        // Slideshows inside the service modals. A Swiper measures itself
        // on init, so it can only start once its modal is actually on
        // screen - hence the deferral to "shown.bs.modal". This is
        // generic: any service in data/services.json whose media type is
        // "swiper" is picked up here, no per-modal code needed.
        $(document).on('shown.bs.modal', '.modal', function () {
            $(this).find('.swiper').each(function () {
                if (this.swiper) {
                    this.swiper.update();
                    return;
                }

                new Swiper(this, {
                    slidesPerView: 1,
                    spaceBetween: 10,
                    loop: true,
                    autoplay: {
                        delay: Number(this.getAttribute('data-autoplay-delay')) || 3000,
                        disableOnInteraction: false,
                    },
                });
            });
        });
    </script>
